<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d1f">
<link rel="icon" href="https://i.postimg.cc/PqDS37Pp/IMG-20261114-WA0327(1).jpg"><title>Social Services PK</title>
<meta name="description" content="Premium digital subscriptions and social services at honest prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{--g9:#07162f;--g8:#0b1f4d;--g7:#1d4ed8;--g6:#2563eb;--g5:#3b82f6;--mint:#e8f0ff;--gold:#3b82f6;--gold2:#7db3ff;--tx:#10213f;--mut:#556a8f;--bd:#dbe4f5;--bg:#fff;--alt:#f2f6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.w{max-width:1200px;margin:0 auto;padding:0 24px}
/* nav */
nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--g8);cursor:pointer;background:none;border:0;padding:0}
.mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--g8),var(--g5));color:#fff;display:grid;place-items:center;font:600 17px "Playfair Display",serif;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.logo span.n{font:700 21px "Playfair Display",serif}
.menu{display:flex;gap:34px;align-items:center}
.menu a.l{color:var(--tx);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;position:relative;padding:6px 0}
.menu a.l:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:.25s}.menu a.l:hover:after{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:4px;padding:15px 30px;font:600 13px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--g7);text-decoration:none;transition:.25s}
.btn:hover{background:var(--g8);transform:translateY(-1px)}.btn svg{width:18px;height:18px;fill:currentColor}
.btn.gold{background:var(--gold);color:#ffffff}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.55)}.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:11px 20px;font-size:12px}.btn.wa{background:#1f9d57}.btn.wa:hover{background:#188548}
.ham{display:none;background:none;border:1px solid var(--bd);border-radius:6px;width:44px;height:44px;cursor:pointer;padding:12px}
.ham i{display:block;height:2px;background:var(--g8);margin:5px 0}
/* hero */
.hero{position:relative;min-height:calc(100vh - 76px);min-height:640px;display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--g9)}
.hero .bg{position:absolute;inset:0}.hero .bg svg,.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,14,38,.94) 0%,rgba(5,14,38,.78) 50%,rgba(5,14,38,.15) 100%)}
.hero .w{position:relative;padding-top:90px;padding-bottom:150px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:22px}
.eyebrow:before{content:"";width:46px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(40px,6.2vw,76px);line-height:1.06;margin:0 0 24px;max-width:780px;font-weight:600}
.hero h1 em{color:var(--gold2);font-weight:500}
.hero p{font-size:18px;max-width:560px;color:#c5d8f5;margin:0 0 38px;font-weight:300}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.strip{position:absolute;left:0;right:0;bottom:0;background:rgba(5,14,38,.72);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12)}
.strip .w{padding-top:22px;padding-bottom:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.strip div{display:flex;gap:14px;align-items:center;font-size:14px;color:#d3e0f5}.strip b{display:block;color:#fff;font-weight:600;letter-spacing:.04em}
.strip svg{width:30px;height:30px;stroke:var(--gold2);fill:none;stroke-width:1.5;flex:none}
/* sections */
section.s{padding:104px 0}section.alt{background:var(--alt)}
.head{text-align:center;max-width:680px;margin:0 auto 56px}
.head .eyebrow{justify-content:center;color:var(--g5)}.head .eyebrow:before,.head .eyebrow:after{content:"";width:34px;height:1px;background:var(--gold)}
.head h2{font-size:clamp(30px,4.2vw,46px);margin:0 0 16px;color:var(--g8);line-height:1.15}.head p{margin:0;color:var(--mut);font-size:17px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-20px 0 44px}
.chip{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:10px 22px;border-radius:99px;font:600 12.5px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--g5)}.chip.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px}
.card{background:#fff;border:1px solid var(--bd);display:flex;flex-direction:column;position:relative;transition:.3s;border-radius:6px;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(29,78,216,.14);border-color:transparent}
.card .im{aspect-ratio:4/3;background:linear-gradient(135deg,var(--g8),var(--g5));overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.9);font:600 54px "Playfair Display",serif}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s}.card:hover .im img{transform:scale(1.05)}
.bdg{position:absolute;top:16px;left:16px;background:var(--gold);color:#ffffff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;z-index:2}
.card .bd{padding:26px;display:flex;flex-direction:column;gap:12px;flex:1}
.cat{color:var(--g5);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.card h3{margin:0;font-size:24px;color:var(--g8);line-height:1.25}
.card ul{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--mut)}.card li{padding:5px 0;border-bottom:1px solid var(--alt);display:flex;gap:10px}
.card li:before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin-top:9px;flex:none}
.pr{margin-top:auto;padding-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pr b{font:600 32px "Playfair Display",serif;color:var(--g8)}.pr s{color:#8093b5;font-size:15px}.pr small{color:var(--mut);font-size:13px}
.card .btn{width:100%}.btn.off{opacity:.45;pointer-events:none}
.empty{text-align:center;color:var(--mut);padding:70px 20px;border:1px solid var(--bd);background:#fff}.empty h3{font-size:26px;color:var(--g8);margin:0 0 8px}
/* features */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border:1px solid var(--bd);background:#fff}
.col{padding:42px 34px;border-right:1px solid var(--bd)}.col:last-child{border:0}
.no{font:500 15px "Playfair Display",serif;color:var(--gold);letter-spacing:.2em;margin-bottom:16px;display:block}
.col h3{margin:0 0 12px;font-size:25px;color:var(--g8)}.col p{margin:0;color:var(--mut);font-size:15.5px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.about h2{font-size:clamp(30px,4vw,44px);color:var(--g8);margin:0 0 20px;line-height:1.15}.about p{color:var(--mut);font-size:17px;margin:0 0 18px}
.pano{aspect-ratio:5/4;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(29,78,216,.25)}.pano svg{width:100%;height:100%;display:block}
.pano:after{content:"";position:absolute;inset:14px;border:1px solid rgba(125,179,255,.55);pointer-events:none}
details{background:#fff;border:1px solid var(--bd);padding:22px 28px;margin:0 auto 14px;max-width:840px}
summary{cursor:pointer;font:600 20px "Playfair Display",serif;color:var(--g8);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--gold);font-size:26px;line-height:1}details[open] summary:after{content:"\2212"}
details p{color:var(--mut);margin:14px 0 0}
.band{background:linear-gradient(120deg,var(--g9),var(--g6));color:#fff;text-align:center;padding:90px 24px;position:relative;overflow:hidden}
.band h2{font-size:clamp(30px,4.4vw,48px);margin:0 0 14px}.band p{color:#c5d8f5;max-width:560px;margin:0 auto 34px;font-size:17px}
footer{background:var(--g9);color:#9fb4d8;padding:72px 0 28px;font-size:14.5px}
footer .g{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:50px;margin-bottom:50px}
footer h4{color:#fff;font:600 13px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px}
footer a{display:block;color:#9fb4d8;text-decoration:none;padding:4px 0}footer a:hover{color:var(--gold2)}
footer .logo{color:#fff;margin-bottom:16px}.copy{border-top:1px solid rgba(255,255,255,.12);padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:#1f9d57;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:40;transition:.2s}
.fab:hover{transform:scale(1.07)}.fab svg{width:30px;height:30px;fill:#fff}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:40px}.col{border-right:0;border-bottom:1px solid var(--bd)}.strip .w{grid-template-columns:1fr;gap:12px}.hero .w{padding-bottom:230px}.hero .ov{background:linear-gradient(180deg,rgba(5,14,38,.86) 0%,rgba(5,14,38,.72) 100%)}
.ham{display:block}.menu{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;padding:22px 24px;gap:18px;border-bottom:1px solid var(--bd)}.menu.open{display:flex}footer .g{grid-template-columns:1fr;gap:34px}section.s{padding:72px 0}}
/* ===== DARK THEME OVERRIDES ===== */
:root{--bg:#060d1f;--alt:#0a1330;--tx:#dbe5f7;--mut:#94a6c8;--bd:#1e2d52;--g8:#f1f6ff;--g5:#7db3ff;--card:#0e1a3a}
body{background:var(--bg);color:var(--tx)}
nav{background:rgba(6,13,31,.88);border-bottom-color:var(--bd)}
.logo{color:#f1f6ff}
.mark{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#0b1636;border:1.5px solid var(--gold);box-shadow:0 0 0 3px rgba(59,130,246,.15);display:grid;place-items:center;color:var(--gold2);font:600 16px "Playfair Display",serif;flex:none}
.menu a.l{color:#c5d3ee}
.btn{background:linear-gradient(135deg,#60a5fa,#1d4ed8);color:#ffffff}.btn:hover{background:linear-gradient(135deg,#7db3ff,#2563eb)}
.btn.wa{background:#1f9d57;color:#fff}.btn.wa:hover{background:#25b567}
.btn.ghost{background:transparent;color:#fff}
.hero{background:#050b1c}.hero .ov{background:linear-gradient(90deg,rgba(5,11,28,.95) 0%,rgba(5,11,28,.8) 50%,rgba(5,11,28,.2) 100%)}
.strip{background:rgba(5,11,28,.78)}.hero p{color:#b4c3e0}.strip div{color:#b4c3e0}
section.alt{background:var(--alt)}
.head h2,.about h2,.card h3,.col h3,.pr b,summary,.empty h3{color:#f1f6ff}
.chip{background:var(--card);color:#c5d3ee}.chip.on{background:var(--gold);color:#ffffff;border-color:var(--gold)}
.card,.cols,details,.empty{background:var(--card);border-color:var(--bd)}
.card:hover{box-shadow:0 24px 48px rgba(0,0,0,.6);border-color:rgba(59,130,246,.4)}
.card li{border-bottom-color:#16254a}.pr s{color:#5f7399}
.col{border-color:var(--bd)}
.pano{box-shadow:0 30px 60px rgba(0,0,0,.6)}
.band{background:radial-gradient(circle at 50% 0,#10265a,#050b1c 70%);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}.band p{color:#aebcd8}
footer{background:#040a18;color:#8fa2c4;border-top:1px solid var(--bd)}footer a{color:#8fa2c4}
.ham{border-color:var(--bd)}
.fab{box-shadow:0 10px 28px rgba(0,0,0,.6)}
/* user chip */
.usr{display:flex;align-items:center;gap:10px;font-size:13px;color:#c5d3ee;border:1px solid var(--bd);border-radius:99px;padding:5px 14px 5px 6px}
.usr i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#ffffff;display:grid;place-items:center;font:700 13px Inter;font-style:normal}
.btn.out{background:transparent;color:#c5d3ee;border:1px solid var(--bd)}.btn.out:hover{border-color:var(--gold);color:var(--gold2);background:transparent}
/* report */
.rp{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1000px;margin:0 auto}
.fm{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:34px}
.fm label,.af label{display:block;font:600 11.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:0 0 7px}
.fm .f,.af .f{margin-bottom:18px}
input,select,textarea{width:100%;background:#0a1634;border:1px solid #263a66;border-radius:6px;padding:13px 15px;color:#f1f6ff;font:400 15px Inter,sans-serif;transition:.2s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
input[readonly]{opacity:.65}textarea{min-height:120px;resize:vertical}
select option{background:#0a1634}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:34px}
.hist h3{margin:0 0 6px;font-size:24px;color:#f1f6ff}.hist p{color:var(--mut);font-size:14px;margin:0 0 18px}
.hi{border-top:1px solid var(--bd);padding:12px 0;font-size:14px}.hi b{color:#f1f6ff;display:block}.hi small{color:var(--mut)}
.msg{font-size:13.5px;padding:11px 14px;border-radius:6px;margin-bottom:16px;display:none}
.msg.err{display:block;background:rgba(220,70,70,.1);border:1px solid rgba(220,70,70,.4);color:#ff9d9d}
.msg.ok{display:block;background:rgba(46,153,103,.1);border:1px solid rgba(46,153,103,.4);color:#8fe0b6}
/* auth */
.au{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.aub{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:60px 64px;background:#050b1c}
.aub .art{position:absolute;inset:0;opacity:.9}.aub .art svg{width:100%;height:100%;display:block}
.aub:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,11,28,.55),rgba(5,11,28,.9))}
.aub>div{position:relative;z-index:2}
.aub .bl{display:flex;align-items:center;gap:16px;margin-bottom:46px}.aub .mark{width:64px;height:64px}
.aub .bl span{font:700 30px "Playfair Display",serif;color:#f1f6ff}
.aub h1{font-size:clamp(34px,4.4vw,56px);line-height:1.1;margin:0 0 20px;color:#f1f6ff}.aub h1 em{color:var(--gold2);font-weight:500}
.aub p{color:#aebcd8;font-size:17px;max-width:460px;font-weight:300;margin:0 0 30px}
.aub ul{list-style:none;padding:0;margin:0;color:#c5d3ee;font-size:14.5px}.aub li{padding:6px 0;display:flex;gap:12px;align-items:center}
.aub li:before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.auf{display:grid;place-items:center;padding:40px 48px;background:radial-gradient(circle at 70% 20%,#0c1a40,#060d1f 60%)}
.af{width:100%;max-width:440px;background:none;border:0;border-radius:0;padding:0;box-shadow:none}
.af h2{margin:0 0 6px;font-size:34px;color:#f1f6ff}.af .sub{color:var(--mut);font-size:14.5px;margin:0 0 28px}
.af .btn{width:100%;margin-top:6px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--gold2);font:600 11px Inter;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px}
.alt2{text-align:center;margin-top:22px;font-size:14px;color:var(--mut)}.alt2 a{color:var(--gold2);font-weight:600;cursor:pointer;text-decoration:none}.alt2 a:hover{text-decoration:underline}
html,body{overflow-x:hidden}
input,select,textarea{font-size:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
@media(max-width:900px){
.rp{grid-template-columns:1fr}.menu{background:#0a1330;border-bottom-color:var(--bd)}.usr{display:none}
.au{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100vh;min-height:100dvh}
.aub{display:flex;padding:30px 22px 26px;justify-content:flex-end;min-height:300px}
.aub .bl{margin-bottom:26px;gap:12px}.aub .mark{width:48px;height:48px}.aub .bl span{font-size:22px}
.aub .eyebrow{font-size:11px;margin-bottom:12px}.aub .eyebrow:before{width:30px}
.aub h1{font-size:30px;margin:0 0 10px}.aub p,.aub ul{display:none}
.auf{place-items:start center;padding:28px 22px 40px;background:var(--bg);align-content:start}
.af h2{font-size:30px}}
@media(max-width:600px){
.w{padding:0 18px}nav .w{height:64px}.menu{top:64px}.logo span.n{font-size:17px}.mark{width:36px;height:36px}
.hero{min-height:auto}.hero .w{padding-top:56px;padding-bottom:250px}.hero p{font-size:16px}
.cta .btn{width:100%}.btn{padding:14px 22px}
.strip .w{padding-top:16px;padding-bottom:16px;gap:10px}.strip div{font-size:13px}
section.s{padding:56px 0}.head{margin-bottom:36px}.head p{font-size:15.5px}
.col{padding:30px 22px}.fm,.hist{padding:24px 18px}.about{gap:30px}
details{padding:18px}summary{font-size:17px}.band{padding:64px 18px}
.card .bd{padding:20px}.pr b{font-size:28px}.fab{right:14px;bottom:14px;width:54px;height:54px}
footer{padding:52px 0 24px}.copy{flex-direction:column}}
/* ===== CUSTOM BROWSER-LEVEL UI ===== */
html{scrollbar-color:#1d4ed8 #060d1f;scrollbar-width:thin}*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#060d1f}
::-webkit-scrollbar-thumb{background:linear-gradient(#7db3ff,#1d4ed8);border-radius:10px;border:2px solid #060d1f}
::selection{background:rgba(125,179,255,.35);color:#fff}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #0a1634 inset;-webkit-text-fill-color:#f1f6ff;caret-color:#f1f6ff;transition:background-color 9999s}
input::-ms-reveal,input::-ms-clear{display:none}
/* modal */
.md{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(2,6,18,.78);backdrop-filter:blur(8px);animation:fi .2s}
.mc{position:relative;width:100%;max-width:420px;background:#0d1a3b;border:1px solid #263a66;border-radius:16px;padding:34px 30px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:up .25s}
.mc:before{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mi{width:54px;height:54px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font:600 26px "Playfair Display",serif;border:1.5px solid var(--gold);color:var(--gold2);background:rgba(59,130,246,.08)}
.mi.success{border-color:#2e9967;color:#8fe0b6;background:rgba(46,153,103,.1)}.mi.error{border-color:#d85a5a;color:#ff9d9d;background:rgba(216,90,90,.1)}
.mc h3{margin:0 0 8px;font-size:25px;color:#f1f6ff}.mc p{margin:0;color:var(--mut);font-size:15px;line-height:1.6}
.mdt{margin:18px 0 0;text-align:left;border:1px solid var(--bd);border-radius:8px;background:#0a1634;font-size:13.5px}

function closeUi(){const d=$('#md');if(d){d.remove();document.body.style.overflow='';document.removeEventListener('keydown',escUi)}}
function escUi(e){if(e.key==='Escape')closeUi()}
function ui(o){closeUi();
 const ic={info:'i',success:'\u2713',warn:'!',error:'\u00d7'}[o.icon||'info'];

 d.onclick=e=>{const x=e.target.dataset&&e.target.dataset.x;if(e.target===d||x==='c'){closeUi()}else if(x==='o'){closeUi();o.onOk&&o.onOk()}};
 document.body.appendChild(d);document.body.style.overflow='hidden';document.addEventListener('keydown',escUi);d.querySelector('[data-x=o]').focus()}

async function hashPw(pw,salt){
 if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}

/* server auth: returns {status,j} or {down:true} when the account server is unreachable / not set up */
async function authSrv(body,token){
 try{const r=await fetch('/api/auth',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(body),cache:'no-store'});
  let j=null;try{j=await r.json()}catch(e){}
  if(!j||r.status===404||r.status===503||r.status===405)return {down:true};
  return {status:r.status,j}}catch(e){return {down:true}}}

 $('#sw').onclick=()=>authView(su?'login':'signup');

  $('#sb').disabled=true;
  try{
  {const name0=su?$('#nm').value.trim().replace(/\s+/g,' '):'';

   }

   if(!sv.down&&!su&&sv.status===401){
    /* one-time migration: account created earlier on this device only */
    const lu=all[email];
    if(lu&&await hashPw(pw,lu.salt)===lu.hash){const m=await authSrv({action:'signup',name:lu.name,email,password:pw});if(!m.down&&m.j.ok)sv=m}
   }
   if(!sv.down){

    return msg((sv.j&&sv.j.message)||'Something went wrong. Please try again.');
   }
  }

  if(su){
   const name=$('#nm').value.trim().replace(/\s+/g,' ');

   if(pw!==$('#pc').value)return msg('Passwords do not match.');
   if(all[email])return msg('This email is already registered. Please sign in instead.');
   const salt=rnd();all[email]={name,email,salt,hash:await hashPw(pw,salt),created:Date.now()};
   if(!LS.set('ssp_users',all)||!LS.set('ssp_session',email))return msg('Could not save your account. Please enable browser storage and try again.');
   ME=currentUser();site();window.scrollTo(0,0);toast('Account created. Welcome, '+name.split(' ')[0]+'.','success');
  }else{
   const lk=LS.get('ssp_lock',{n:0,t:0});
   if(lk.t>Date.now())return msg('Too many attempts. Please try again in '+Math.ceil((lk.t-Date.now())/1000)+' seconds.');
   const u=all[email];
   if(!u||await hashPw(pw,u.salt)!==u.hash){lk.n=(lk.n||0)+1;if(lk.n>=5){lk.n=0;lk.t=Date.now()+60000}LS.set('ssp_lock',lk);return msg('Incorrect email or password.')}
   LS.set('ssp_lock',{n:0,t:0});LS.set('ssp_session',email);ME=currentUser();site();window.scrollTo(0,0);toast('Welcome back, '+u.name.split(' ')[0]+'.','success');
  }}catch(e){console.error(e);msg('Something went wrong. Please refresh the page and try again.')}finally{const b=$('#sb');if(b)b.disabled=false}
 };

 img.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.85,d;do{d=c.toDataURL('image/webp',q);if(d.indexOf('data:image/png')===0)d=c.toDataURL('image/jpeg',q);q-=.12}while(d.length>limit&&q>.2);
  d.length>limit?rej(new Error('Image is too large. Please choose a smaller image.')):res(d)};
 img.onerror=()=>rej(new Error('This file is not a valid image.'));img.src=u})}

function skinSite(){
 document.body.classList.add('sk');const r=$('#root');if(!r.querySelector('nav'))return;
 r.querySelector('nav').remove();
 const hd=document.createElement('div');hd.className='hd';
 hd.innerHTML=`<div class="hr"><a class="wm-a" href="#home">${wm}</a><div class="ic"><button class="ib g" id="hpl" type="button" aria-label="Shop">+</button><button class="ib" id="hac" type="button" aria-label="Account">${I.user}</button><button class="ib" id="hmn" type="button" aria-label="Menu">${I.menu}</button></div></div><form class="sb" id="sf"><span>${I.srch}</span><input id="sq" placeholder="Search subscriptions, social media services and tools..." autocomplete="off"><button type="submit">Search</button></form><div class="pl"><button type="button" data-f="hot"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.500 5 10a5 5 0 01-10 0c0-2 1-3 2-4 .3 1.500 1 2 2 2 0-3-1-5 1-8z"/></svg> Hot Offers</button><button type="button" data-f="best"><svg viewBox="0 0 24 24"><path d="M12 3l2.700 5.600 6.100.8-4.500 4.200 1.100 6.100L12 16.800 6.600 19.700l1.100-6.100L3.200 9.400l6.100-.8z"/></svg> Best Sellers</button><button type="button" data-f="all">${I.stack} All Products</button><button type="button" data-f="trk">${I.truck} Track Order</button></div>`;

 $('#sf').onsubmit=e=>{e.preventDefault();const q=$('#sq').value.trim().toLowerCase();filt(c=>c.textContent.toLowerCase().includes(q))};
 hd.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const f=b.dataset.f;if(f==='trk')return go('orders');if(f==='hot')filt(c=>c.querySelector('.dsc'));else if(f==='best')filt(c=>c.querySelector('.bdg'));else{$('#sq').value='';filt(()=>true)}});

 cards().forEach(c=>{

 const dr=document.createElement('div');dr.className='dr';
