<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Services PK</title>
<meta name="description" content="Premium digital subscriptions and social services at honest prices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{--g9:#07241a;--g8:#0f3d2e;--g7:#14543a;--g6:#1d6b4a;--g5:#2e9967;--mint:#eaf4ee;--gold:#c2a14e;--gold2:#d9bd72;--tx:#14231c;--mut:#587064;--bd:#dce8e1;--bg:#fff;--alt:#f4f8f5}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.01em}
.w{max-width:1200px;margin:0 auto;padding:0 24px}
/* nav */
nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--g8);cursor:pointer;background:none;border:0;padding:0}
.mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--g8),var(--g5));color:#fff;display:grid;place-items:center;font:600 17px "Playfair Display",serif;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.logo span.n{font:700 21px "Playfair Display",serif}
.menu{display:flex;gap:34px;align-items:center}
.menu a.l{color:var(--tx);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;position:relative;padding:6px 0}
.menu a.l:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:.25s}.menu a.l:hover:after{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:4px;padding:15px 30px;font:600 13px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--g7);text-decoration:none;transition:.25s}
.btn:hover{background:var(--g8);transform:translateY(-1px)}.btn svg{width:18px;height:18px;fill:currentColor}
.btn.gold{background:var(--gold);color:#1a1405}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.55)}.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.sm{padding:11px 20px;font-size:12px}.btn.wa{background:#1f9d57}.btn.wa:hover{background:#188548}
.ham{display:none;background:none;border:1px solid var(--bd);border-radius:6px;width:44px;height:44px;cursor:pointer;padding:12px}
.ham i{display:block;height:2px;background:var(--g8);margin:5px 0}
/* hero */
.hero{position:relative;min-height:calc(100vh - 76px);min-height:640px;display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--g9)}
.hero .bg{position:absolute;inset:0}.hero .bg svg,.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,26,18,.94) 0%,rgba(5,26,18,.78) 50%,rgba(5,26,18,.15) 100%)}
.hero .w{position:relative;padding-top:90px;padding-bottom:150px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:22px}
.eyebrow:before{content:"";width:46px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(40px,6.2vw,76px);line-height:1.06;margin:0 0 24px;max-width:780px;font-weight:600}
.hero h1 em{color:var(--gold2);font-weight:500}
.hero p{font-size:18px;max-width:560px;color:#cfe3d8;margin:0 0 38px;font-weight:300}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.strip{position:absolute;left:0;right:0;bottom:0;background:rgba(5,26,18,.72);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.12)}
.strip .w{padding-top:22px;padding-bottom:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.strip div{display:flex;gap:14px;align-items:center;font-size:14px;color:#d6e8de}.strip b{display:block;color:#fff;font-weight:600;letter-spacing:.04em}
.strip svg{width:30px;height:30px;stroke:var(--gold2);fill:none;stroke-width:1.5;flex:none}
/* sections */
section.s{padding:104px 0}section.alt{background:var(--alt)}
.head{text-align:center;max-width:680px;margin:0 auto 56px}
.head .eyebrow{justify-content:center;color:var(--g5)}.head .eyebrow:before,.head .eyebrow:after{content:"";width:34px;height:1px;background:var(--gold)}
.head h2{font-size:clamp(30px,4.2vw,46px);margin:0 0 16px;color:var(--g8);line-height:1.15}.head p{margin:0;color:var(--mut);font-size:17px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-20px 0 44px}
.chip{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:10px 22px;border-radius:99px;font:600 12.5px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--g5)}.chip.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px}
.card{background:#fff;border:1px solid var(--bd);display:flex;flex-direction:column;position:relative;transition:.3s;border-radius:6px;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(15,61,46,.14);border-color:transparent}
.card .im{aspect-ratio:4/3;background:linear-gradient(135deg,var(--g8),var(--g5));overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.9);font:600 54px "Playfair Display",serif}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s}.card:hover .im img{transform:scale(1.05)}
.bdg{position:absolute;top:16px;left:16px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;z-index:2}
.card .bd{padding:26px;display:flex;flex-direction:column;gap:12px;flex:1}
.cat{color:var(--g5);font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.card h3{margin:0;font-size:24px;color:var(--g8);line-height:1.25}
.card ul{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--mut)}.card li{padding:5px 0;border-bottom:1px solid var(--alt);display:flex;gap:10px}
.card li:before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);margin-top:9px;flex:none}
.pr{margin-top:auto;padding-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pr b{font:600 32px "Playfair Display",serif;color:var(--g8)}.pr s{color:#98a8a0;font-size:15px}.pr small{color:var(--mut);font-size:13px}
.card .btn{width:100%}.btn.off{opacity:.45;pointer-events:none}
.empty{text-align:center;color:var(--mut);padding:70px 20px;border:1px solid var(--bd);background:#fff}.empty h3{font-size:26px;color:var(--g8);margin:0 0 8px}
/* features */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border:1px solid var(--bd);background:#fff}
.col{padding:42px 34px;border-right:1px solid var(--bd)}.col:last-child{border:0}
.no{font:500 15px "Playfair Display",serif;color:var(--gold);letter-spacing:.2em;margin-bottom:16px;display:block}
.col h3{margin:0 0 12px;font-size:25px;color:var(--g8)}.col p{margin:0;color:var(--mut);font-size:15.5px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.about h2{font-size:clamp(30px,4vw,44px);color:var(--g8);margin:0 0 20px;line-height:1.15}.about p{color:var(--mut);font-size:17px;margin:0 0 18px}
.pano{aspect-ratio:5/4;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(15,61,46,.25)}.pano svg{width:100%;height:100%;display:block}
.pano:after{content:"";position:absolute;inset:14px;border:1px solid rgba(217,189,114,.55);pointer-events:none}
details{background:#fff;border:1px solid var(--bd);padding:22px 28px;margin:0 auto 14px;max-width:840px}
summary{cursor:pointer;font:600 20px "Playfair Display",serif;color:var(--g8);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";color:var(--gold);font-size:26px;line-height:1}details[open] summary:after{content:"\2212"}
details p{color:var(--mut);margin:14px 0 0}
.band{background:linear-gradient(120deg,var(--g9),var(--g6));color:#fff;text-align:center;padding:90px 24px;position:relative;overflow:hidden}
.band h2{font-size:clamp(30px,4.4vw,48px);margin:0 0 14px}.band p{color:#cfe3d8;max-width:560px;margin:0 auto 34px;font-size:17px}
footer{background:var(--g9);color:#9fbdae;padding:72px 0 28px;font-size:14.5px}
footer .g{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:50px;margin-bottom:50px}
footer h4{color:#fff;font:600 13px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px}
footer a{display:block;color:#9fbdae;text-decoration:none;padding:4px 0}footer a:hover{color:var(--gold2)}
footer .logo{color:#fff;margin-bottom:16px}.copy{border-top:1px solid rgba(255,255,255,.12);padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:#1f9d57;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:40;transition:.2s}
.fab:hover{transform:scale(1.07)}.fab svg{width:30px;height:30px;fill:#fff}
@media(max-width:900px){.about{grid-template-columns:1fr;gap:40px}.col{border-right:0;border-bottom:1px solid var(--bd)}.strip .w{grid-template-columns:1fr;gap:12px}.hero .w{padding-bottom:230px}.hero .ov{background:linear-gradient(180deg,rgba(5,26,18,.86) 0%,rgba(5,26,18,.72) 100%)}
.ham{display:block}.menu{display:none;position:absolute;top:76px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;padding:22px 24px;gap:18px;border-bottom:1px solid var(--bd)}.menu.open{display:flex}footer .g{grid-template-columns:1fr;gap:34px}section.s{padding:72px 0}}
/* ===== DARK THEME OVERRIDES ===== */
:root{--bg:#07090a;--alt:#0b0e0d;--tx:#d9d5ca;--mut:#97a29b;--bd:#212927;--g8:#f3ecd9;--g5:#d9bd72;--card:#101413}
body{background:var(--bg);color:var(--tx)}
nav{background:rgba(7,9,10,.88);border-bottom-color:var(--bd)}
.logo{color:#f3ecd9}
.mark{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#111;border:1.5px solid var(--gold);box-shadow:0 0 0 3px rgba(194,161,78,.15);display:grid;place-items:center;color:var(--gold2);font:600 16px "Playfair Display",serif;flex:none}
.menu a.l{color:#cfcabd}
.btn{background:linear-gradient(135deg,#e2c982,#b8923a);color:#1a1405}.btn:hover{background:linear-gradient(135deg,#f0dba0,#c9a24a)}
.btn.wa{background:#1f9d57;color:#fff}.btn.wa:hover{background:#25b567}
.btn.ghost{background:transparent;color:#fff}
.hero{background:#050606}.hero .ov{background:linear-gradient(90deg,rgba(5,6,6,.95) 0%,rgba(5,6,6,.8) 50%,rgba(5,6,6,.2) 100%)}
.strip{background:rgba(5,6,6,.78)}.hero p{color:#c4c0b4}.strip div{color:#c4c0b4}
section.alt{background:var(--alt)}
.head h2,.about h2,.card h3,.col h3,.pr b,summary,.empty h3{color:#f3ecd9}
.chip{background:var(--card);color:#cfcabd}.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.card,.cols,details,.empty{background:var(--card);border-color:var(--bd)}
.card:hover{box-shadow:0 24px 48px rgba(0,0,0,.6);border-color:rgba(194,161,78,.4)}
.card li{border-bottom-color:#1a211f}.pr s{color:#6f7b75}
.col{border-color:var(--bd)}
.pano{box-shadow:0 30px 60px rgba(0,0,0,.6)}
.band{background:radial-gradient(circle at 50% 0,#1c1810,#060707 70%);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}.band p{color:#b9b5a9}
footer{background:#040505;color:#8b958f;border-top:1px solid var(--bd)}footer a{color:#8b958f}
.ham{border-color:var(--bd)}
.fab{box-shadow:0 10px 28px rgba(0,0,0,.6)}
/* user chip */
.usr{display:flex;align-items:center;gap:10px;font-size:13px;color:#cfcabd;border:1px solid var(--bd);border-radius:99px;padding:5px 14px 5px 6px}
.usr i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1a1405;display:grid;place-items:center;font:700 13px Inter;font-style:normal}
.btn.out{background:transparent;color:#cfcabd;border:1px solid var(--bd)}.btn.out:hover{border-color:var(--gold);color:var(--gold2);background:transparent}
/* report */
.rp{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1000px;margin:0 auto}
.fm{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:34px}
.fm label,.af label{display:block;font:600 11.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:0 0 7px}
.fm .f,.af .f{margin-bottom:18px}
input,select,textarea{width:100%;background:#0a0d0c;border:1px solid #2a3330;border-radius:6px;padding:13px 15px;color:#f3ecd9;font:400 15px Inter,sans-serif;transition:.2s;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,161,78,.15)}
input[readonly]{opacity:.65}textarea{min-height:120px;resize:vertical}
select option{background:#0a0d0c}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:34px}
.hist h3{margin:0 0 6px;font-size:24px;color:#f3ecd9}.hist p{color:var(--mut);font-size:14px;margin:0 0 18px}
.hi{border-top:1px solid var(--bd);padding:12px 0;font-size:14px}.hi b{color:#f3ecd9;display:block}.hi small{color:var(--mut)}
.msg{font-size:13.5px;padding:11px 14px;border-radius:6px;margin-bottom:16px;display:none}
.msg.err{display:block;background:rgba(220,70,70,.1);border:1px solid rgba(220,70,70,.4);color:#ff9d9d}
.msg.ok{display:block;background:rgba(46,153,103,.1);border:1px solid rgba(46,153,103,.4);color:#8fe0b6}
/* auth */
.au{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.aub{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:60px 64px;background:#050606}
.aub .art{position:absolute;inset:0;opacity:.9}.aub .art svg{width:100%;height:100%;display:block}
.aub:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,6,.55),rgba(5,6,6,.9))}
.aub>div{position:relative;z-index:2}
.aub .bl{display:flex;align-items:center;gap:16px;margin-bottom:46px}.aub .mark{width:64px;height:64px}
.aub .bl span{font:700 30px "Playfair Display",serif;color:#f3ecd9}
.aub h1{font-size:clamp(34px,4.4vw,56px);line-height:1.1;margin:0 0 20px;color:#f3ecd9}.aub h1 em{color:var(--gold2);font-weight:500}
.aub p{color:#b9b5a9;font-size:17px;max-width:460px;font-weight:300;margin:0 0 30px}
.aub ul{list-style:none;padding:0;margin:0;color:#cfcabd;font-size:14.5px}.aub li{padding:6px 0;display:flex;gap:12px;align-items:center}
.aub li:before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.auf{display:grid;place-items:center;padding:40px 48px;background:radial-gradient(circle at 70% 20%,#14110a,#07090a 60%)}
.af{width:100%;max-width:440px;background:none;border:0;border-radius:0;padding:0;box-shadow:none}
.af h2{margin:0 0 6px;font-size:34px;color:#f3ecd9}.af .sub{color:var(--mut);font-size:14.5px;margin:0 0 28px}
.af .btn{width:100%;margin-top:6px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--gold2);font:600 11px Inter;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px}
.alt2{text-align:center;margin-top:22px;font-size:14px;color:var(--mut)}.alt2 a{color:var(--gold2);font-weight:600;cursor:pointer;text-decoration:none}.alt2 a:hover{text-decoration:underline}
html,body{overflow-x:hidden}
input,select,textarea{font-size:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
@media(max-width:900px){
.rp{grid-template-columns:1fr}.menu{background:#0b0e0d;border-bottom-color:var(--bd)}.usr{display:none}
.au{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:100vh;min-height:100dvh}
.aub{display:flex;padding:30px 22px 26px;justify-content:flex-end;min-height:300px}
.aub .bl{margin-bottom:26px;gap:12px}.aub .mark{width:48px;height:48px}.aub .bl span{font-size:22px}
.aub .eyebrow{font-size:11px;margin-bottom:12px}.aub .eyebrow:before{width:30px}
.aub h1{font-size:30px;margin:0 0 10px}.aub p,.aub ul{display:none}
.auf{place-items:start center;padding:28px 22px 40px;background:var(--bg);align-content:start}
.af h2{font-size:30px}}
@media(max-width:600px){
.w{padding:0 18px}nav .w{height:64px}.menu{top:64px}.logo span.n{font-size:17px}.mark{width:36px;height:36px}
.hero{min-height:auto}.hero .w{padding-top:56px;padding-bottom:250px}.hero p{font-size:16px}
.cta .btn{width:100%}.btn{padding:14px 22px}
.strip .w{padding-top:16px;padding-bottom:16px;gap:10px}.strip div{font-size:13px}
section.s{padding:56px 0}.head{margin-bottom:36px}.head p{font-size:15.5px}
.col{padding:30px 22px}.fm,.hist{padding:24px 18px}.about{gap:30px}
details{padding:18px}summary{font-size:17px}.band{padding:64px 18px}
.card .bd{padding:20px}.pr b{font-size:28px}.fab{right:14px;bottom:14px;width:54px;height:54px}
footer{padding:52px 0 24px}.copy{flex-direction:column}}
/* ===== CUSTOM BROWSER-LEVEL UI ===== */
html{scrollbar-color:#8a6d2b #07090a;scrollbar-width:thin}*{-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#07090a}
::-webkit-scrollbar-thumb{background:linear-gradient(#d9bd72,#8a6d2b);border-radius:10px;border:2px solid #07090a}
::selection{background:rgba(217,189,114,.35);color:#fff}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #0a0d0c inset;-webkit-text-fill-color:#f3ecd9;caret-color:#f3ecd9;transition:background-color 9999s}
input::-ms-reveal,input::-ms-clear{display:none}
/* modal */
.md{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(2,3,3,.78);backdrop-filter:blur(8px);animation:fi .2s}
.mc{position:relative;width:100%;max-width:420px;background:#0f1312;border:1px solid #2a3330;border-radius:16px;padding:34px 30px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:up .25s}
.mc:before{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mi{width:54px;height:54px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font:600 26px "Playfair Display",serif;border:1.5px solid var(--gold);color:var(--gold2);background:rgba(194,161,78,.08)}
.mi.success{border-color:#2e9967;color:#8fe0b6;background:rgba(46,153,103,.1)}.mi.error{border-color:#d85a5a;color:#ff9d9d;background:rgba(216,90,90,.1)}
.mc h3{margin:0 0 8px;font-size:25px;color:#f3ecd9}.mc p{margin:0;color:var(--mut);font-size:15px;line-height:1.6}
.mdt{margin:18px 0 0;text-align:left;border:1px solid var(--bd);border-radius:8px;background:#0a0d0c;font-size:13.5px}
.mdt div{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--bd)}.mdt div:last-child{border:0}
.mdt b{flex:none;width:78px;color:var(--gold2);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}.mdt span{color:#d9d5ca;word-break:break-word;min-width:0}
.mb{display:flex;gap:10px;margin-top:24px}.mb .btn{flex:1;margin:0}
/* toast */
.ts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:110;display:flex;align-items:center;gap:12px;max-width:min(92vw,440px);background:#0f1312;border:1px solid #2a3330;border-left:3px solid var(--gold);border-radius:10px;padding:13px 18px;color:#f3ecd9;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:up .25s}
.ts.success{border-left-color:#2e9967}.ts.error{border-left-color:#d85a5a}
/* select */
.cs{position:relative}.cs-b{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:#0a0d0c;border:1px solid #2a3330;border-radius:6px;padding:13px 15px;color:#f3ecd9;font:400 16px Inter,sans-serif;cursor:pointer;transition:.2s}
.cs-b:after{content:"";width:8px;height:8px;border-right:2px solid var(--gold2);border-bottom:2px solid var(--gold2);transform:rotate(45deg) translateY(-2px);transition:.2s}
.cs.open .cs-b,.cs-b:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,161,78,.15);outline:0}.cs.open .cs-b:after{transform:rotate(-135deg) translateY(-2px)}
.cs-l{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#0f1312;border:1px solid #2a3330;border-radius:8px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.7);max-height:260px;overflow:auto}
.cs.open .cs-l{display:block;animation:up .15s}
.cs-o{padding:11px 12px;border-radius:6px;color:#cfcabd;font-size:15px;cursor:pointer}.cs-o:hover,.cs-o.on{background:rgba(194,161,78,.14);color:#f3ecd9}.cs-o.on{color:var(--gold2)}
@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}

function closeUi(){const d=$('#md');if(d){d.remove();document.body.style.overflow='';document.removeEventListener('keydown',escUi)}}
function escUi(e){if(e.key==='Escape')closeUi()}
function ui(o){closeUi();
 const ic={info:'i',success:'\u2713',warn:'!',error:'\u00d7'}[o.icon||'info'];
 const d=document.createElement('div');d.className='md';d.id='md';
 d.innerHTML=`<div class="mc" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mi ${o.icon||'info'}">${ic}</div><h3 id="mt">${esc(o.title)}</h3><p>${esc(o.text||'')}</p>${o.rows?`<div class="mdt">${o.rows.map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`:''}<div class="mb">${o.cancel===null?'':`<button class="btn out sm" data-x="c">${esc(o.cancel||'Cancel')}</button>`}<button class="btn gold sm" data-x="o">${esc(o.ok||'OK')}</button></div></div>`;
 d.onclick=e=>{const x=e.target.dataset&&e.target.dataset.x;if(e.target===d||x==='c'){closeUi()}else if(x==='o'){closeUi();o.onOk&&o.onOk()}};
 document.body.appendChild(d);document.body.style.overflow='hidden';document.addEventListener('keydown',escUi);d.querySelector('[data-x=o]').focus()}
let tsT;function toast(t,k){const o=$('#ts');if(o)o.remove();const e=document.createElement('div');e.id='ts';e.className='ts '+(k||'');e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);clearTimeout(tsT);tsT=setTimeout(()=>e.remove(),3800)}
window.alert=m=>ui({title:'Notice',text:String(m),ok:'OK',cancel:null});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.card a.btn.wa[href^="https://wa.me"]');if(!a||a.classList.contains('off'))return;e.preventDefault();
 const nm=(a.closest('.card').querySelector('h3')||{}).textContent||'this service';
 ui({title:'Continue to WhatsApp',text:'Your order details will open in WhatsApp so you can send them to our team.',rows:[['Service',nm]],ok:'Open WhatsApp',icon:'info',onOk:()=>{window.open(a.href,'_blank','noopener')}})});
function confirmLogout(){ui({title:'Log out?',text:'You will need to sign in again to access your account.',ok:'Log out',icon:'warn',onOk:logout})}
function initSelect(){const c=$('#rc');if(!c)return;const b=c.querySelector('.cs-b'),ops=[...c.querySelectorAll('.cs-o')];
 const set=i=>{ops.forEach((o,k)=>o.classList.toggle('on',k===i));c.dataset.v=ops[i].textContent;b.firstElementChild.textContent=ops[i].textContent;c.dataset.i=i};
 const cur=()=>+c.dataset.i||0;
 b.onclick=()=>c.classList.toggle('open');ops.forEach((o,k)=>o.onclick=()=>{set(k);c.classList.remove('open')});
 b.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();set(Math.min(ops.length-1,cur()+1))}else if(e.key==='ArrowUp'){e.preventDefault();set(Math.max(0,cur()-1))}else if(e.key==='Escape')c.classList.remove('open')};
 document.addEventListener('click',e=>{if(!c.contains(e.target))c.classList.remove('open')});
 c.reset=()=>set(0);set(0)}
/* ===== AUTH + COMPLAINT SYSTEM ===== */
const LOGO='https://i.postimg.cc/VkXfmspy/367162-modified.png';
const logoImg=()=>`<img class="mark" src="${LOGO}" alt="Social Services PK logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mark',textContent:'SS'}))">`;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const normEmail=e=>String(e||'').trim().toLowerCase();
const rnd=()=>{const a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function hashPw(pw,salt){
 if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}
const users=()=>LS.get('ssp_users',{});
const currentUser=()=>{const e=LS.get('ssp_session',null);return e?users()[e]||null:null};
let ME=null;

function authView(mode){
 const su=mode==='signup';ME=null;
 $('#fab').style.display='none';document.title='Social Services PK | '+(su?'Create Account':'Sign In');
 const fld=(id,l,t,ph,ac)=>`<div class="f"><label for="${id}">${l}</label>${t==='password'?`<div class="pw"><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"><button type="button" data-show="${id}">Show</button></div>`:`<input id="${id}" type="${t}" placeholder="${ph}" autocomplete="${ac}">`}</div>`;
 $('#root').innerHTML=`<div class="au"><aside class="aub"><div class="art">${banner()}</div><div>
  <div class="bl">${logoImg()}<span>Social Services PK</span></div>
  <div class="eyebrow">Trusted Digital Services</div>
  <h1>Premium subscriptions,<br>delivered with <em>integrity.</em></h1>
  <p>Genuine digital subscriptions and social services at honest prices, backed by fast activation and attentive support.</p>
  <ul><li>Genuine service, transparent pricing</li><li>Fast activation on WhatsApp</li><li>Direct complaint and report line</li></ul></div></aside>
  <main class="auf"><form class="af" id="af" novalidate>  <h2>${su?'Create your account':'Welcome back'}</h2><p class="sub">${su?'Join Social Services PK in less than a minute.':'Sign in to continue to your dashboard.'}</p>
  <div class="msg" id="msg"></div>
  ${su?fld('nm','Full name','text','Your full name','name'):''}
  ${fld('em','Email address','email','you@example.com','email')}
  ${fld('pw','Password','password',su?'At least 8 characters, letters and numbers':'Your password',su?'new-password':'current-password')}
  ${su?fld('pc','Confirm password','password','Re-enter your password','new-password'):''}
  <button class="btn gold" type="submit" id="sb">${su?'Create Account':'Sign In'}</button>
  <div class="alt2">${su?'Already have an account? <a id="sw">Sign in</a>':'New to Social Services PK? <a id="sw">Create an account</a>'}</div></form></main></div>`;
 const msg=(t,c)=>{const m=$('#msg');m.className='msg '+(c||'err');m.textContent=t};
 document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.show);const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'});
 $('#sw').onclick=()=>authView(su?'login':'signup');
 $('#af').onsubmit=async ev=>{ev.preventDefault();
  const email=normEmail($('#em').value),pw=$('#pw').value,all=users();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return msg('Please enter a valid email address.');
  $('#sb').disabled=true;
  try{
  if(su){
   const name=$('#nm').value.trim().replace(/\s+/g,' ');
   if(name.length<2)return msg('Please enter your full name.');
   if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return msg('Password must be at least 8 characters and include letters and numbers.');
   if(pw!==$('#pc').value)return msg('Passwords do not match.');
   if(all[email])return msg('This email is already registered. Please sign in instead.');
   const salt=rnd();all[email]={name,email,salt,hash:await hashPw(pw,salt),created:Date.now()};
   if(!LS.set('ssp_users',all)||!LS.set('ssp_session',email))return msg('Could not save your account. Please enable browser storage and try again.');
   ME=currentUser();site();window.scrollTo(0,0);toast('Account created. Welcome, '+name.split(' ')[0]+'.','success');
  }else{
   const lk=LS.get('ssp_lock',{n:0,t:0});
   if(lk.t>Date.now())return msg('Too many attempts. Please try again in '+Math.ceil((lk.t-Date.now())/1000)+' seconds.');
   const u=all[email];
   if(!u||await hashPw(pw,u.salt)!==u.hash){lk.n=(lk.n||0)+1;if(lk.n>=5){lk.n=0;lk.t=Date.now()+60000}LS.set('ssp_lock',lk);return msg('Incorrect email or password.')}
   LS.set('ssp_lock',{n:0,t:0});LS.set('ssp_session',email);ME=currentUser();site();window.scrollTo(0,0);toast('Welcome back, '+u.name.split(' ')[0]+'.','success');
  }}catch(e){console.error(e);msg('Something went wrong. Please refresh the page and try again.')}finally{const b=$('#sb');if(b)b.disabled=false}
 };
}
function logout(){try{localStorage.removeItem('ssp_session')}catch(e){}authView('login');toast('You have been logged out.')}

function initReport(){
 const f=$('#rf');if(!f||!ME)return;initSelect();
 const key='ssp_reports_'+ME.email;
 const draw=()=>{const h=LS.get(key,[]);$('#hl').innerHTML=h.length?h.slice(0,5).map(r=>`<div class="hi"><b>${esc(r.id)} \u00b7 ${esc(r.cat)}</b>${esc(r.subject)}<br><small>${new Date(r.t).toLocaleString('en-GB')}</small></div>`).join(''):'<div class="hi"><small>No reports sent yet.</small></div>'};
 draw();
 f.onsubmit=ev=>{ev.preventDefault();
  const cat=$('#rc').dataset.v,ref=$('#rr').value.trim(),sub=$('#rs').value.trim(),body=$('#rb').value.trim();
  if(sub.length<3||body.length<10){ui({title:'Details missing',text:'Please add a subject and describe the issue in at least 10 characters.',icon:'error',cancel:null});return}
  ui({title:'Send this report?',text:'WhatsApp will open with your report ready to send to our team.',rows:[['Category',cat],['Subject',sub],['Account',ME.email]],ok:'Continue',icon:'info',onOk:()=>{
   const id='SSP-'+Date.now().toString(36).toUpperCase().slice(-6),when=new Date().toLocaleString('en-GB');
   const text=`*NEW COMPLAINT / REPORT*\nTicket: ${id}\nDate: ${when}\n\n*Customer*\nName: ${ME.name}\nEmail: ${ME.email}\n\n*Details*\nCategory: ${cat}\n${ref?'Order / Service: '+ref+'\n':''}Subject: ${sub}\n\n*Message*\n${body}`;
   const h=LS.get(key,[]);h.unshift({id,cat,subject:sub,t:Date.now()});LS.set(key,h.slice(0,30));
   const url=wa(text);const w=window.open(url,'_blank','noopener');if(!w)location.href=url;
   f.reset();$('#rc').reset();draw();
   setTimeout(()=>ui({title:'Report '+id+' ready',text:'WhatsApp has opened with your details. Press Send there to deliver your report.',icon:'success',cancel:null,ok:'Done'}),300)}})
 };
}
function boot2(){ME=currentUser();if(ME)site();else authView('signup')}
/* ===== FIREBASE + ADMIN PANEL (owner only, open with  yoursite/#admin) ===== */
let inAdmin=false,unsubAuth=null,FB=null;
async function fb(){
 if(FB)return FB;
 if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.indexOf('PASTE')===0)throw new Error('not-configured');
 const V='https://www.gstatic.com/firebasejs/10.12.2/';
 const [a,au,fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
 const app=a.initializeApp(FIREBASE_CONFIG);
 FB={auth:au.getAuth(app),db:fs.getFirestore(app),m:{...au,...fs}};return FB}
async function loadData(){
 D={settings:{whatsapp:DEFAULT_WA,phone:'03005591403'},products:[]};
 try{const f=await fb(),m=f.m;
  const s=await m.getDoc(m.doc(f.db,'settings','main'));if(s.exists())D.settings={...D.settings,...s.data()};
  const p=await m.getDocs(m.collection(f.db,'products'));D.products=p.docs.map(x=>x.data()).sort((x,y)=>(x.t||0)-(y.t||0));
 }catch(e){console.warn('Data not loaded:',e.message)}}
function shrink(file,max,limit){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  let q=.85,d;do{d=c.toDataURL('image/webp',q);if(d.indexOf('data:image/png')===0)d=c.toDataURL('image/jpeg',q);q-=.12}while(d.length>limit&&q>.2);
  d.length>limit?rej(new Error('Image is too large. Please choose a smaller image.')):res(d)};
 img.onerror=()=>rej(new Error('This file is not a valid image.'));img.src=u})}
const fbErr=e=>/permission|insufficient/i.test(e.message||'')?'Permission denied. Check your Firestore rules and admin email.':(e.message||'Something went wrong.');

function adminShell(html){$('#fab').style.display='none';document.title='Admin | Social Services PK';$('#root').innerHTML=html}
function adminSetup(){adminShell(`<div class="adm"><div class="fm" style="max-width:640px;margin:40px auto"><h3>Admin setup needed</h3><p class="note">Password is correct, but Firebase is not configured yet. Open <code>index.html</code>, paste your Firebase details into <code>FIREBASE_CONFIG</code> and set <code>ADMIN_EMAIL</code> at the top of the script, then upload the file again.</p><a class="btn out sm" href="#">Back to website</a></div></div>`)}
async function adminView(){
 inAdmin=true;ME=null;
 let f=null;try{f=await fb()}catch(e){}
 if(unsubAuth)unsubAuth();
 if(!f)return adminLogin(null);
 unsubAuth=f.m.onAuthStateChanged(f.auth,u=>{if(!inAdmin)return;(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())?adminPanel(f):adminLogin(f)})}

function adminLogin(f){
 adminShell(`<main class="auf" style="min-height:100vh"><form class="af" id="alf" novalidate><div class="bl" style="display:flex;align-items:center;gap:14px;margin-bottom:30px">${logoImg()}<b style="font:700 22px 'Playfair Display',serif;color:#f3ecd9">Admin Access</b></div>
 <h2>Owner login</h2><p class="sub">Enter your admin password to manage products.</p><div class="msg" id="msg"></div>
 <div class="f"><label for="ap">Password</label><div class="pw"><input id="ap" type="password" autocomplete="current-password" placeholder="Admin password"><button type="button" id="ash">Show</button></div></div>
 <button class="btn gold" id="asb" type="submit">Sign In</button><div class="alt2"><a href="#">Back to website</a></div></form></main>`);
 $('#ash').onclick=()=>{const i=$('#ap'),s=i.type==='password';i.type=s?'text':'password';$('#ash').textContent=s?'Hide':'Show'};
 $('#alf').onsubmit=async ev=>{ev.preventDefault();const b=$('#asb'),pw=$('#ap').value;if(!pw)return;b.disabled=true;
  const m=$('#msg');
  let h;try{h=await sha256(pw)}catch(e){m.className='msg err';m.textContent='Please open the site over https to log in.';b.disabled=false;return}
  if(h!==ADMIN_PASS_HASH){m.className='msg err';m.textContent='Incorrect password.';b.disabled=false;return}
  if(!f)return adminSetup();
  try{await f.m.signInWithEmailAndPassword(f.auth,ADMIN_EMAIL,pw)}
  catch(e){m.className='msg err';m.textContent=/network/i.test(e.code||'')?'Network error. Please try again.':'Password is correct, but the Firebase owner account needs the same password.';b.disabled=false}}}

function adminPanel(f){
 const m=f.m;
 adminShell(`<div class="adm"><header class="ah"><div class="bl2">${logoImg()}<span>Admin Panel</span></div><div style="display:flex;gap:10px"><a class="btn out sm" href="#">View website</a><button class="btn out sm" id="alo">Log out</button></div></header>
 <div class="ag"><section class="fm"><h3 id="pt">Add product</h3><form id="pf" novalidate>
  <div class="f"><label for="pn">Product name</label><input id="pn" maxlength="80" placeholder="e.g. Netflix Premium"></div>
  <div class="r2"><div class="f"><label for="pc">Category</label><input id="pc" maxlength="40" placeholder="e.g. Streaming"></div><div class="f"><label for="pd">Duration</label><input id="pd" maxlength="40" placeholder="e.g. 1 month"></div></div>
  <div class="r2"><div class="f"><label for="pp">Price</label><input id="pp" type="number" inputmode="decimal" min="0" placeholder="500"></div><div class="f"><label for="po">Old price (optional)</label><input id="po" type="number" inputmode="decimal" min="0" placeholder="800"></div></div>
  <div class="f"><label for="pb">Badge (optional)</label><input id="pb" maxlength="24" placeholder="e.g. Best Seller"></div>
  <div class="f"><label for="pf2">Features (one per line)</label><textarea id="pf2" maxlength="800" placeholder="Full HD quality&#10;Private profile"></textarea></div>
  <div class="f"><label for="pi">Product image</label><img class="pv" id="pv" alt=""><input id="pi" type="file" accept="image/*"></div>
  <label class="ck"><input type="checkbox" id="pst" checked> In stock</label>
  <div style="display:flex;gap:10px"><button class="btn gold" id="psb" type="submit" style="flex:1">Publish product</button></div></form></section>
 <section class="fm"><h3>Your products</h3><div id="pl"></div></section>
</div></div>`);
 const reset=()=>{$('#pf').reset();$('#pst').checked=true;$('#pv').style.display='none'};
 const draw=()=>{const cur=esc((D.settings||{}).currency||'Rs.');$('#pl').innerHTML=D.products.length?D.products.map(p=>`<div class="pi">${p.image?`<img src="${esc(p.image)}" alt="">`:'<i></i>'}<div><b>${esc(p.name)}</b><span>${cur} ${esc(p.price)}${p.duration?' · '+esc(p.duration):''}${p.in_stock===false?' · Out of stock':''}</span></div><button class="btn out sm" data-d="${esc(p.id)}">Delete</button></div>`).join(''):'<p class="note">No products yet. Add your first product on the left.</p>';
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=D.products.find(x=>x.id===b.dataset.d);if(!p)return;
   ui({title:'Delete product?',text:'"'+p.name+'" will be removed from your website.',ok:'Delete',icon:'warn',onOk:async()=>{try{await m.deleteDoc(m.doc(f.db,'products',p.id));await loadData();draw();toast('Product deleted.','success')}catch(e){toast(fbErr(e),'error')}}})})};
 $('#pi').onchange=e=>{const x=e.target.files[0];if(x){$('#pv').src=URL.createObjectURL(x);$('#pv').style.display='block'}};
 $('#alo').onclick=()=>m.signOut(f.auth);
 $('#pf').onsubmit=async ev=>{ev.preventDefault();
  const name=$('#pn').value.trim(),price=parseFloat($('#pp').value),old=parseFloat($('#po').value);
  if(!name)return toast('Please enter the product name.','error');
  if(!isFinite(price)||price<0)return toast('Please enter a valid price.','error');
  const b=$('#psb');b.disabled=true;
  try{let image='';const file=$('#pi').files[0];if(file)image=await shrink(file,900,400000);
   const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
   await m.setDoc(m.doc(f.db,'products',id),{id,name:name.slice(0,80),category:$('#pc').value.trim().slice(0,40),duration:$('#pd').value.trim().slice(0,40),price,old_price:isFinite(old)&&old>=0?old:null,badge:$('#pb').value.trim().slice(0,24),features:$('#pf2').value.slice(0,800),image:image||'',in_stock:$('#pst').checked,t:Date.now()});
   await loadData();draw();reset();toast('Published. Your website is updated.','success')
  }catch(e){toast(fbErr(e),'error')}finally{b.disabled=false}};
 draw()}

window.addEventListener('hashchange',()=>{if(location.hash==='#admin'&&!inAdmin)adminView();else if(inAdmin&&location.hash!=='#admin'){inAdmin=false;boot2()}});
async function boot(){await loadData();if(location.hash==='#admin')adminView();else boot2()}
boot();
